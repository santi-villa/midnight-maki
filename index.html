<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1f2440" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Midnight Maki" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <title>Midnight Maki</title>
    <style>
      /* boot loader: visible before any script runs */
      html, body { margin: 0; background: #1f2440; height: 100%; overflow: hidden; }
      #boot { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(circle at 50% 45%, #2c3358 0%, #1f2440 60%, #14162a 100%); color: #f6ecd6; font-family: system-ui, sans-serif; transition: opacity .6s; }
      #boot.out { opacity: 0; pointer-events: none; }
      #boot img { width: 96px; height: 96px; image-rendering: pixelated; animation: bootbob 1s ease-in-out infinite; border-radius: 20px; }
      #boot .t { font-size: 22px; letter-spacing: 2px; color: #f2c66d; }
      #boot .bar { width: 180px; height: 8px; border-radius: 6px; background: rgba(246,236,214,.15); overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, #d9a3a6, #f2c66d); border-radius: 6px; animation: bootbar 1.2s ease-in-out infinite; }
      #boot .tip { font-size: 13px; opacity: .7; max-width: 260px; text-align: center; min-height: 34px; }
      #boot .stars i { position: absolute; width: 2px; height: 2px; background: #f6ecd6; animation: twinkle 2s infinite; }
      @keyframes bootbob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
      @keyframes bootbar { 0% { transform: translateX(-100%) } 100% { transform: translateX(260%) } }
      @keyframes twinkle { 0%, 100% { opacity: .2 } 50% { opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="stars">
        <i style="left:12%;top:18%"></i><i style="left:80%;top:12%;animation-delay:.6s"></i><i style="left:65%;top:30%;animation-delay:1.1s"></i>
        <i style="left:25%;top:70%;animation-delay:.3s"></i><i style="left:88%;top:75%;animation-delay:1.4s"></i><i style="left:45%;top:8%;animation-delay:.9s"></i>
      </div>
      <img src="./icons/icon-192.png" alt="" />
      <div class="t">Midnight Maki</div>
      <div class="bar"><i></i></div>
      <div class="tip" id="boot-tip">Encendiendo los faroles…</div>
    </div>
    <div id="game"></div>
    <div id="ui"></div>
    <script>
      (function () {
        var tips = ['Encendiendo los faroles…', 'Pip está buscando su cuchara…', 'Spicy calienta el wasabi…', 'Rigg ordena sus mapas…', 'Cocinando arroz para sushi…'];
        var i = 0, el = document.getElementById('boot-tip');
        window.__bootTips = setInterval(function () { i = (i + 1) % tips.length; if (el) el.textContent = tips[i]; }, 1400);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
