<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1f2440" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Maki & Mapaches" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png?v=2" />
    <title>Maki &amp; Mapaches</title>
    <style>
      /* boot loader: visible before any script runs */
      html, body { margin: 0; background: #1f2440; height: 100%; overflow: hidden; }
      #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; padding: 24px; box-sizing: border-box;
        background: radial-gradient(ellipse at 50% 40%, #3a2a22 0%, #1a1424 55%, #100e16 100%); color: #f6ecd6;
        font-family: 'Pixelify Sans', ui-monospace, monospace; text-align: center; transition: opacity 320ms ease; }
      #boot.out { opacity: 0; pointer-events: none; }
      #boot .boot-window { display: none; }
      #boot .boot-card { z-index: 1; width: min(420px, 88vw); display: grid; justify-items: center; gap: 10px; padding: 22px 18px 16px;
        background: linear-gradient(#f8eed3, #f1e1bd); border: 3px solid #b98d5a; border-radius: 14px;
        box-shadow: inset 0 0 0 2px #dcc08e, 0 5px 0 #8b6a46, 0 22px 40px rgba(0,0,0,.45); }
      #boot .boot-lantern { z-index: 1; width: 64px; height: 96px; image-rendering: pixelated; animation: lantern-glow 1.8s steps(3) infinite; }
      #boot .boot-title { z-index: 1; margin: 0; font-size: clamp(22px, 5.4vw, 34px); line-height: 1.05; letter-spacing: 2px; color: #3a2a1e; }
      #boot .boot-subtitle { z-index: 1; font-size: 13px; letter-spacing: 1px; color: #7a6247; }
      #boot .tip { z-index: 1; font-size: 14px; line-height: 1.5; color: #3a2a1e; background: #fbf3dc; border: 2px solid #dcc08e; border-radius: 8px; padding: 8px 10px; max-width: 300px; min-height: 42px; }
      #boot .boot-bar { z-index: 1; width: min(260px, 64vw); height: 14px; border: 2px solid #8b6a46; border-radius: 7px; background: #e3c98f; overflow: hidden; }
      #boot .boot-bar i { display: block; height: 100%; width: 8%; background: repeating-linear-gradient(90deg, #f2c66d 0 8px, #e0a94f 8px 10px); transition: width 260ms steps(8); }
      .boot-petals { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      #boot .petal { position: absolute; top: -20px; width: 8px; height: 6px; border-radius: 6px 1px 6px 2px; background: #f3b6c0; box-shadow: 2px 0 #e08fa0; opacity: .75; pointer-events: none; animation: petal-fall 10s linear infinite; }
      #boot .petal:nth-child(3n) { width: 5px; height: 4px; opacity: .45; background: #ffd2df; }
      @keyframes petal-fall { to { transform: translate(40px, 110vh) rotate(260deg); } }
      @keyframes lantern-glow { 0%,100% { opacity: .8; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }
      @media (prefers-reduced-motion: reduce) { #boot .petal { display: none; } #boot, #boot .boot-lantern { animation: none; transition: none; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Cargando Maki & Mapaches" aria-busy="true">
      <div class="boot-window" aria-hidden="true"></div>
      <div class="boot-card">
      <svg class="boot-lantern" viewBox="0 0 16 24" shape-rendering="crispEdges" aria-hidden="true">
        <path fill="#3b2930" d="M7 0h2v4H7zM4 4h8v2H4zM2 6h12v14H2zM4 20h8v2H4zM7 22h2v2H7z"/>
        <path fill="#b8524f" d="M4 5h8v2H4zM3 7h10v12H3zM4 19h8v2H4z"/>
        <path fill="#f2c66d" d="M5 7h6v12H5zM4 9h8v8H4z"/>
        <path fill="#f9df9b" d="M7 8h2v10H7z"/>
        <path fill="#a8714a" d="M3 10h10v1H3zM3 15h10v1H3z"/>
      </svg>
      <h1 class="boot-title">MAKI &amp; MAPACHES</h1>
      <div class="boot-subtitle">Los secretos de Villa Nori</div>
      <div class="boot-bar" aria-hidden="true"><i id="boot-fill"></i></div>
      <div class="tip" id="boot-tip">Encendiendo los faroles…</div>
      </div>
      <div class="boot-petals" aria-hidden="true"></div>
    </div>
    <div id="game"></div>
    <div id="ui"></div>
    <script>
      (function () {
        var field = document.querySelector('.boot-petals');
        for (var n = 0; n < 28; n++) {
          var petal = document.createElement('i'); petal.className = 'petal';
          petal.style.left = (n * 37 % 100) + '%';
          petal.style.animationDuration = (8 + n % 7) + 's';
          petal.style.animationDelay = -(n * 1.73 % (8 + n % 7)) + 's';
          field.appendChild(petal);
        }
        var tips = ['Encendiendo los faroles…', 'Pip está buscando su cuchara…', 'Spicy calienta el wasabi…', 'Rigg ordena sus mapas…', 'Cocinando arroz para sushi…'];
        var i = 0, el = document.getElementById('boot-tip');
        window.__bootProgress = function (p) { var f = document.getElementById('boot-fill'); if (f) f.style.width = Math.max(8, Math.min(100, Math.round(p * 100))) + '%'; };
        window.__bootTips = setInterval(function () { i = (i + 1) % tips.length; if (el) el.textContent = tips[i]; }, 1400);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
