<!doctype html>
<html><head><meta charset="utf-8"><title>Vista previa de arte</title>
<style>body{background:#6b4330;margin:0;padding:12px;font:14px sans-serif;color:#fff}canvas{image-rendering:pixelated;margin:4px;vertical-align:bottom}</style>
</head><body><div id="out"></div>
<script type="module">
import { buildRaccoonSheet, buildRaccoonPortrait } from './src/art/raccoon.ts';
import { CHAR_BY_ID } from './src/data/characters.ts';
const builds = { spicy: 'small', rigg: 'medium', pip: 'big' };
const out = document.getElementById('out');
const S = Number(new URLSearchParams(location.search).get('s') ?? 4);
for (const [id, b] of Object.entries(builds)) {
  const { canvas } = buildRaccoonSheet(CHAR_BY_ID[id].appearance, b);
  const c = document.createElement('canvas');
  const list = (new URLSearchParams(location.search).get('f') ?? '0,3,6,9,13,14,15,18').split(',').map(Number);
  const fw = canvas.width / 24;
  c.width = fw * list.length * S; c.height = canvas.height * S;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  list.forEach((f, i) => g.drawImage(canvas, f * fw, 0, fw, canvas.height, i * fw * S, 0, fw * S, canvas.height * S));
  const row = document.createElement('div'); row.append(c); out.append(row);
}

import { buildCharacterSheet, FW, FH } from './src/art/characters.ts';
import { defaultAppearance } from './src/core/state.ts';
import { CHARACTERS } from './src/data/characters.ts';
{
  const list = (new URLSearchParams(location.search).get('f') ?? '0,3,6,13').split(',').map(Number);
  const looks = [defaultAppearance(), ...CHARACTERS.filter((c) => !c.raccoon).map((c) => c.appearance)];
  const per = Number(new URLSearchParams(location.search).get('per') ?? 6);
  for (let k = 0; k < looks.length; k += per) {
    const group = looks.slice(k, k + per);
    const c = document.createElement('canvas'); c.width = (FW * list.length + 6) * group.length * S; c.height = FH * S;
    const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
    group.forEach((a, j) => {
      const sheet = buildCharacterSheet(a);
      list.forEach((f, i) => g.drawImage(sheet, f * FW, 0, FW, FH, (j * (FW * list.length + 6) + i * FW) * S, 0, FW * S, FH * S));
    });
    const row = document.createElement('div'); row.append(c); out.append(row);
  }
}
</script></body></html>
