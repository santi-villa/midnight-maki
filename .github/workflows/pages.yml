name: Publicar en GitHub Pages

on:
  push:
    branches: [master, master-mgsshv]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # read access to the private repo with the licensed packs (docs/packs-privados.md); without it the game builds with its own art
      PACKS_TOKEN: ${{ secrets.PACKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # the cuts of the licensed packs live in a private repo: they go into the built game, never into this public one
      - name: Packs con licencia (repo privado)
        if: ${{ env.PACKS_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PACKS_REPO || 'santi-villa/midnight-maki-packs' }}
          token: ${{ env.PACKS_TOKEN }}
          path: src/assets/packs
      - name: Aviso si no hay packs
        if: ${{ env.PACKS_TOKEN == '' }}
        run: 'echo "::warning::Sin PACKS_TOKEN: la web se publica con el arte propio del juego, sin los packs con licencia."'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # public Firebase settings (not secrets): set them in GitHub > Settings > Secrets and variables > Actions > Variables
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
